<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UPPSC इतिहास क्विज़ — महमूद गजनवी</title>
<style>
:root{--navy:#12203a;--blue:#245391;--gold:#f0b83c;--bg:#f2f5fa;--green:#16834f;--red:#bd3535}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Nirmala UI",sans-serif;background:var(--bg);color:#222b3a}
header{background:var(--navy);color:white;padding:24px 16px;text-align:center}header h1{margin:0 0 8px;font-size:clamp(22px,4vw,34px)}header p{margin:0;color:#dce4f0}
main{max-width:850px;margin:20px auto;padding:0 14px}.panel{background:white;border-radius:18px;padding:22px;box-shadow:0 5px 22px #15294a12}
.meta{display:flex;justify-content:space-between;gap:12px;color:#536278;font-size:14px}.track{height:8px;background:#e2e8f0;border-radius:20px;overflow:hidden;margin:12px 0 22px}.bar{height:100%;width:0;background:var(--blue);transition:width .2s}
h2{font-size:clamp(19px,3vw,25px);line-height:1.45;margin:8px 0 20px}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opt{border:1px solid #cbd5e1;background:white;border-radius:12px;padding:15px;text-align:left;font-size:17px;cursor:pointer;color:#222b3a;min-height:64px}.opt:hover:not(:disabled){border-color:var(--blue);background:#f3f7ff}.opt:disabled{cursor:default}.opt.correct{border:2px solid var(--green);background:#e8f7ee}.opt.wrong{border:2px solid var(--red);background:#fff0f0}
.feedback{display:none;margin-top:18px;padding:16px;border-radius:12px;background:#f0f4f9;line-height:1.65}.feedback.show{display:block}.feedback strong{display:block;margin-bottom:7px}.right{color:var(--green)}.wrongtxt{color:var(--red)}
.controls{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.btn{border:0;border-radius:10px;background:var(--navy);color:white;padding:12px 18px;font-size:16px;cursor:pointer}.btn:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#e5eaf1;color:var(--navy)}.hidden{display:none}.result{text-align:center}.score{font-size:48px;font-weight:bold;color:var(--blue)}
footer{text-align:center;color:#64748b;padding:24px 12px;font-size:13px}
@media(max-width:600px){.options{grid-template-columns:1fr}.panel{padding:16px}.opt{min-height:54px}.controls .btn{flex:1}}
</style></head>
<body>
<header><h1>UPPSC इतिहास क्विज़</h1><p>महमूद गजनवी और हिंदू शाही वंश • 35 MCQ</p></header>
<main><section class="panel" id="quiz">
<div class="meta"><span id="counter">प्रश्न 1 / 35</span><span id="scoretop">सही: 0</span></div>
<div class="track"><div class="bar" id="bar"></div></div>
<h2 id="question"></h2><div class="options" id="options"></div>
<div class="feedback" id="feedback" aria-live="polite"></div>
<div class="controls"><button class="btn secondary" id="prev" disabled>← पिछला</button><button class="btn" id="next" disabled>अगला प्रश्न →</button></div>
</section>
<section class="panel result hidden" id="result"><h2>क्विज़ पूरा हुआ!</h2><div class="score" id="finalscore"></div><p id="message"></p><button class="btn" id="restart">फिर से क्विज़ दें</button></section>
</main><footer>अभ्यास सामग्री • UPPSC Prelims तैयारी • मोबाइल और कंप्यूटर दोनों पर उपयोग करें</footer>
<script>
const questions = [["1009 ई. में महमूद गजनवी ने किस शाही शासक को पराजित किया?", ["जयपाल", "आनंदपाल", "त्रिलोचनपाल", "भीमपाल"], 1, "पुस्तक के अनुच्छेद के अनुसार, 1009 ई. में सिंधु नदी के पास हुए युद्ध में आनंदपाल पराजित हुआ।"], ["आनंदपाल और महमूद गजनवी का निर्णायक युद्ध किस नदी के पास बताया गया है?", ["गंगा", "रावी", "सिंधु", "यमुना"], 2, "अनुच्छेद में निर्णायक युद्ध का स्थान सिंधु नदी के पास बताया गया है।"], ["आनंदपाल की नई राजधानी का नाम क्या था?", ["नंदन या नंदनपुर", "थानेश्वर", "मथुरा", "मुल्तान"], 0, "अनुच्छेद में आनंदपाल की नई राजधानी नंदन या नंदनपुर बताई गई है।"], ["नंदन या नंदनपुर किस क्षेत्र में स्थित था?", ["मालवा", "साल्ट रेंज", "बुंदेलखंड", "गंगा का मैदान"], 1, "नंदन साल्ट रेंज में स्थित था। यह क्षेत्र वर्तमान पाकिस्तान के पंजाब में है।"], ["आनंदपाल के किस दुर्ग को महमूद गजनवी ने नष्ट किया?", ["रणथंभौर", "कालिंजर", "नगरकोट", "चित्तौड़"], 2, "अनुच्छेद के अनुसार, महमूद ने आनंदपाल के नगरकोट नामक किले को नष्ट किया। नगरकोट की पहचान सामान्यतः कांगड़ा से की जाती है।"], ["नगरकोट वर्तमान में किस ऐतिहासिक क्षेत्र से संबंधित है?", ["कांगड़ा", "अजमेर", "दिल्ली", "कन्नौज"], 0, "नगरकोट का संबंध हिमाचल प्रदेश के कांगड़ा क्षेत्र से जोड़ा जाता है।"], ["आनंदपाल को किस नगर से कुछ समय तक शासन करने की अनुमति मिली?", ["गजनी", "लाहौर", "काबुल", "दिल्ली"], 1, "अनुच्छेद के अनुसार, पराजय के बाद आनंदपाल को अधीनस्थ राजा के रूप में कुछ समय तक लाहौर से शासन करने दिया गया।"], ["पुस्तक के अनुसार, महमूद गजनवी ने लाहौर तक पहुँचकर आनंदपाल को कब खदेड़ा?", ["1001 ई.", "1009 ई.", "1015 ई.", "1025 ई."], 2, "दिए गए अनुच्छेद में 1015 ई. में महमूद के लाहौर पहुँचने और आनंदपाल को खदेड़ने का उल्लेख है।"], ["महमूद गजनवी का 1015 ई. का कश्मीर अभियान क्यों असफल रहा?", ["खराब मौसम के कारण", "नौसेना की कमी के कारण", "राजधानी में विद्रोह के कारण", "हाथियों की कमी के कारण"], 0, "पुस्तक के अनुसार, खराब मौसम के कारण कश्मीर पर महमूद का हमला असफल रहा।"], ["शाही शासकों का समर्थन करने वाला मुस्लिम शासक कौन था?", ["मुल्तान का मुस्लिम राजा", "गजनी का शासक", "दिल्ली का शासक", "बंगाल का शासक"], 0, "अनुच्छेद में मुल्तान के मुस्लिम राजा का उल्लेख है, जो गजनी से होने वाले हमलों से परेशान था।"], ["अनुच्छेद के अनुसार, मुल्तान के राजा को किस बात की चिंता थी?", ["समुद्री व्यापार", "गजनी से होने वाले हमले", "मंगोल आक्रमण", "दक्षिण भारत का विस्तार"], 1, "मुल्तान का राजा गजनी से होने वाले हमलों और गुलाम प्राप्त करने के लिए किए जाने वाले अभियानों से परेशान था।"], ["महमूद गजनवी के भारतीय अभियानों का एक प्रमुख उद्देश्य क्या बताया गया है?", ["सिंचाई व्यवस्था बनाना", "समृद्ध मंदिरों और नगरों को लूटना", "विश्वविद्यालय स्थापित करना", "कृषि सुधार करना"], 1, "अनुच्छेद के अनुसार, कई अभियानों में समृद्ध मंदिरों और नगरों को लूटकर धन प्राप्त करना एक प्रमुख उद्देश्य था।"], ["लूट से प्राप्त संपत्ति महमूद गजनवी के लिए किस प्रकार उपयोगी थी?", ["मध्य एशिया में युद्ध जारी रखने के लिए", "समुद्री बेड़ा बनाने के लिए", "चीन में राजधानी बनाने के लिए", "यूरोप में उपनिवेश स्थापित करने के लिए"], 0, "लूट की संपत्ति ने महमूद को मध्य एशिया के शत्रुओं के विरुद्ध युद्ध जारी रखने के संसाधन दिए।"], ["महमूद गजनवी का साम्राज्य किस नगर को केंद्र बनाकर विकसित हुआ?", ["दिल्ली", "गजनी", "कन्नौज", "अजमेर"], 1, "गजनी गजनवी सत्ता का प्रमुख राजनीतिक केंद्र था।"], ["महमूद गजनवी के विरुद्ध संघर्ष में किस शाही शासक का नाम प्रमुख है?", ["आनंदपाल", "पृथ्वीराज चौहान", "राणा सांगा", "स्कंदगुप्त"], 0, "आनंदपाल शाही वंश का प्रमुख शासक था जिसने महमूद गजनवी का प्रतिरोध किया।"], ["आनंदपाल किस राजवंश या राजनीतिक सत्ता से संबंधित था?", ["गुर्जर-प्रतिहार", "हिंदू शाही", "चोल", "पाल"], 1, "आनंदपाल हिंदू शाही वंश का शासक था, जिसका राज्य उत्तर-पश्चिमी भारतीय उपमहाद्वीप में था।"], ["जयपाल का आनंदपाल से क्या संबंध था?", ["पिता-पुत्र", "भाई-भाई", "गुरु-शिष्य", "चाचा-भतीजा"], 0, "आनंदपाल, जयपाल का पुत्र और उत्तराधिकारी था। जयपाल ने भी महमूद गजनवी के विरुद्ध संघर्ष किया था।"], ["गजनवी राज्य की राजधानी कहाँ थी?", ["लाहौर", "गजनी", "मुल्तान", "नंदन"], 1, "गजनी गजनवी राज्य की राजधानी थी। लाहौर बाद में गजनवी शासन का एक महत्वपूर्ण केंद्र भी बना।"], ["अनुच्छेद में राजपूत राजाओं की सहायता का उल्लेख किस संदर्भ में है?", ["आनंदपाल के समर्थन के संदर्भ में", "महमूद के साथ व्यापार के संदर्भ में", "दिल्ली सल्तनत की स्थापना के संदर्भ में", "मुगल साम्राज्य के विस्तार के संदर्भ में"], 0, "अनुच्छेद में इतिहासकार फिरिश्ता के वर्णन के आधार पर आनंदपाल की सहायता के लिए विभिन्न राजपूत राजाओं के आने की चर्चा है।"], ["फिरिश्ता कौन था?", ["मध्यकालीन इतिहासकार", "गजनवी सेनापति", "शाही राजा", "अरब व्यापारी"], 0, "मुहम्मद कासिम फिरिश्ता मध्यकालीन इतिहासकार था। उसने भारतीय उपमहाद्वीप के मुस्लिम शासकों और उनके अभियानों का इतिहास लिखा।"], ["अनुच्छेद में किन तीन राजपूत राजधानियों या राज्यों का उल्लेख है?", ["दिल्ली, अजमेर और कन्नौज", "पटना, बंगाल और कांची", "उज्जैन, मदुरै और तंजावुर", "लाहौर, काबुल और गजनी"], 0, "अनुच्छेद में दिल्ली, अजमेर और कन्नौज के राजाओं सहित कई राजपूत शासकों के सहायता देने का उल्लेख है।"], ["अनुच्छेद के अनुसार, 1001 ई. में किस शासक की सहायता का उल्लेख फिरिश्ता ने किया?", ["जयपाल", "आनंदपाल", "राज्यपाल", "त्रिलोचनपाल"], 0, "दिए गए अनुच्छेद में फिरिश्ता के वर्णन के अनुसार, अनेक राजपूत राजाओं द्वारा 1001 ई. में जयपाल की सहायता का उल्लेख है।"], ["अनुच्छेद में दिल्ली के पुराने नाम या रूप का उल्लेख किस प्रकार किया गया है?", ["इंद्रप्रस्थ", "ढिल्लिका", "पाटलिपुत्र", "कौशांबी"], 1, "अनुच्छेद में दिल्ली के लिए ढिल्लिका नाम का उल्लेख है और उस समय इसे छोटा राज्य बताया गया है।"], ["अनुच्छेद में कन्नौज के गुर्जर-प्रतिहारों की स्थिति कैसी बताई गई है?", ["बहुत शक्तिशाली", "कमजोर", "दक्षिण भारत के शासक", "गजनवी राज्य के संस्थापक"], 1, "पुस्तक के अनुसार, गुर्जर-प्रतिहारों की शक्ति पहले की तुलना में कमजोर हो चुकी थी।"], ["गुर्जर-प्रतिहारों का प्रभाव कभी किस क्षेत्र तक बताया गया है?", ["धारेश्वर", "कश्मीर", "बंगाल की खाड़ी", "श्रीलंका"], 0, "अनुच्छेद में गुर्जर-प्रतिहारों के पूर्व प्रभाव का उल्लेख धारेश्वर तक बताया गया है। स्थान की पहचान संदर्भ के आधार पर समझनी चाहिए।"], ["अनुच्छेद के अनुसार, महमूद गजनवी लगभग किस वर्ष गंगा की घाटी पर आक्रमण करने की स्थिति में पहुँचा?", ["1001 ई.", "1009 ई.", "1015 ई.", "1030 ई."], 2, "अनुच्छेद के अंतिम भाग में कहा गया है कि 1015 ई. तक महमूद गंगा की घाटी पर आक्रमण करने की स्थिति में पहुँच गया था।"], ["महमूद न let index=0, answers={}, score=0;
const $=id=>document.getElementById(id);
function render(){
 const q=questions[index]; $('counter').textContent=`प्रश्न ${index+1} / ${questions.length}`;
 $('scoretop').textContent=`सही: ${score}`; $('bar').style.width=`${index/questions.length*100}%`;
 $('question').textContent=q[0]; $('options').innerHTML=''; $('feedback').className='feedback'; $('feedback').innerHTML='';
 q[1].forEach((opt,j)=>{const b=document.createElement('button');b.className='opt';b.textContent='ABCD'[j]+'. '+opt;b.onclick=()=>choose(j);$('options').appendChild(b)});
 $('prev').disabled=index===0; $('next').disabled=answers[index]===undefined;
 if(answers[index]!==undefined) showFeedback(answers[index]);
}
function choose(j){if(answers[index]!==undefined)return;answers[index]=j;if(j===questions[index][2])score++;showFeedback(j);$('scoretop').textContent=`सही: ${score}`;$('next').disabled=false;}
function showFeedback(j){
 const q=questions[index], buttons=[...$('options').children];
 buttons.forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('correct');if(k===j&&j!==q[2])b.classList.add('wrong')});
 $('feedback').className='feedback show';
 $('feedback').innerHTML=`<strong class="${j===q[2]?'right':'wrongtxt'}">${j===q[2]?'✓ सही उत्तर!':'✗ आपका उत्तर सही नहीं है।'}</strong><b>सही उत्तर: ${'ABCD'[q[2]]}. ${q[1][q[2]]}</b><p>${q[3]}</p>`;
}
$('next').onclick=()=>{if(index<questions.length-1){index++;render()}else finish()};
$('prev').onclick=()=>{if(index>0){index--;render()}};
function finish(){$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('finalscore').textContent=`${score} / ${questions.length}`;$('message').textContent=`आपका स्कोर ${Math.round(score/questions.length*100)}% है। गलत उत्तरों के विवरण दोबारा पढ़ें और अभ्यास करें।`;}
$('restart').onclick=()=>{index=0;answers={};score=0;$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()};
render();
</script></body></html>
